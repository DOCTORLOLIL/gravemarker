name: בניית אפליקציה
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - name: יצירת תיקיית אנדרואיד
        run: |
          flutter create --platforms=android --org ltd.bulu --project-name gravemarker .
          rm -rf test
          python3 tool/patch_android.py
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: בדיקת קוד
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: בניית APK
        run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/*-release.apk
      - name: פרסום להורדה
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build
          name: גרסת בדיקה
          prerelease: true
          overwrite_files: true
          files: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
