name: בניית אפליקציה
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-v1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - name: יצירת תיקיית אנדרואיד
        run: |
          flutter create --platforms=android --org ltd.bulu --project-name gravemarker .
          rm -rf test
          python3 tool/patch_android.py
      - name: מפתח חתימה קבוע
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/upload.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=upload\nstoreFile=upload.jks\n' "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/key.properties
            python3 tool/patch_signing.py
          else
            echo "::warning::אין מפתח חתימה קבוע – הגרסה נחתמת במפתח זמני ולא תתעדכן מעל גרסה קודמת"
          fi
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: בדיקת קוד
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: בניית APK
        run: |
          flutter build apk --release --split-per-abi --build-number=${{ github.run_number }} --dart-define=BUILD=${{ github.run_number }}
          # גרסה אחת לכל סוגי הטלפונים (גם ישנים, 32 ביט)
          flutter build apk --release --build-number=${{ github.run_number }} --dart-define=BUILD=${{ github.run_number }}
          # קובץ גרסה – האפליקציה בודקת אותו ומציעה עדכון. כשיהיה דף בחנות, להחליף את url לקישור לחנות
          echo '{"build": ${{ github.run_number }}, "url": "https://gravemarker.bulu.ltd/download/"}' > build/version.json
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/*-release.apk
      - name: פרסום להורדה
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build
          name: גרסת בדיקה
          prerelease: true
          overwrite_files: true
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-release.apk
            build/version.json
